[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geodynamics"
version = "0.1.0"
description = "Geometry-aware state-space models for sequences of SPD matrices"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.13",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
geodynamics-train = "GeoDynamics.train_geodynamics:main"
geodynamics-summarize = "GeoDynamics.summarize_folds:main"

[tool.setuptools]
package-dir = {"" = "GeoDynamics"}

[tool.setuptools.packages.find]
where = ["GeoDynamics"]
include = ["GeoDynamics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
